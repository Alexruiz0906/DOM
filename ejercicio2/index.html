<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <button class="btn  btn-outline-success" id="sumar">Sumar Clic</button>
     <button class="btn  btn-outline-danger" id="reiniciar">Reinicio</button>
    <p class="fw-light" id="p">0</p>
    <script>
        const btnSumar = document.getElementById("sumar");
        const btnReinicio = document.getElementById("reiniciar");
        const p = document.getElementById("p");
        let contador = 0;
        btnSumar.addEventListener("click", function Sumar(){
            contador += 1
            p.textContent = contador
            if (contador === 10){
                p.classList.add("text-success")
            }
        })
        btnReinicio.addEventListener("click", function (){
            contador = 0
            p.textContent = contador
            p.classList.remove("text-success")
        })
        
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
