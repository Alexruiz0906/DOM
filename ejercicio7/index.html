<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-md-4">
                <input type="password" id="password" class="form-control">
                <p id="texto"></p> 
            </div>
        </div>
    </div>
    <script>
        const input = document.getElementById("password")
        const texto = document.getElementById("texto")
        input.addEventListener("input", function(){
            let contra = input.value
            texto.classList.remove("text-danger", "text-warning", "text-success")
            if ( contra.length < 6){
                texto.classList.add("text-danger")
                texto.innerText = "Contraseña muy corta"
            }
            else if(contra.length >= 6 && contra.length<= 9){
                texto.classList.add("text-warning")
                texto.innerText = "Contraseña aceptable"
            }
            else if(contra.length >= 10){
                texto.classList.add("text-success")
                texto.innerText = "Contraseña fuerte"
            }
        })
    </script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
