<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="card" style="width: 18rem;">
        <div class="card-body" id="card">
            <img src="" alt="..." class="card-img-top" id="card-imagen">
            <p class="card-title fw-bold" id="card-nombre">Tu nombre</p>
            <p class="card-text" id="card-profesion">Tu profesion</p>
        </div>
    </div>
    <input type="text" name="name" id="name" class="form-control">
    <input type="text" id="profesion" class="form-control">
    <input type="text" id="imagen" class="form-control">

    <script>
        const inputNombre = document.getElementById("name")
        const inputProfesion = document.getElementById("profesion")
        const inputImagen = document.getElementById("imagen")

        const cardNombre = document.getElementById("card-nombre")
        const cardProfesion = document.getElementById("card-profesion")
        const cardImagen = document.getElementById("card-imagen")

        inputNombre.addEventListener("input", function () {
            cardNombre.textContent = inputNombre.value
        })

        inputProfesion.addEventListener("input", function () {
            cardProfesion.textContent = inputProfesion.value
        })

        inputImagen.addEventListener("input", function () {
            cardImagen.src = inputImagen.value
        })
        const inputs = document.querySelectorAll("input")

        inputs.forEach(function (input) {
            input.addEventListener("input", function () {
                const destino = document.getElementById(input.dataset.target)
                if (destino.tagName === "img") {
                    destino.src = input.value
                } else {
                    destino.textContent = input.value
                }
            })
        })
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
