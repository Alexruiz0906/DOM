<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
        <div class="container">
        <div class="row">
            <div class="col-md-4">
                <input type="text" class="form-control" id="input" placeholder="Agrega lo que desea comprar">
                <button class="btn btn-outline-danger" id="btn">Agregar</button>
                <ul id="ul" class="list-group">
                </ul>
            </div>
        </div>
    </div>
<script>
    const input = document.getElementById("input")
        const btn = document.getElementById("btn")
        const ul = document.getElementById("ul")
        btn.addEventListener("click", function () {
            ul.innerHTML += `
                            <li class="list-group-item fw-bold">${input.value}</li>
            
            
            
            `
            input.value = ""
        })
</script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
