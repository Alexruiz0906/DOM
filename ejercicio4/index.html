<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-md-4">
                <div class="card" id="card">
                    <div class="card-body">
                        <div class="card-text">Titulo</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="row">
            <div class="col-md-4">
                <select name="color" id="selector">
                    <option value="" selected disabled>Blanco</option>
                    <option value="primary">Azul</option>
                    <option value="success">Verde</option>
                    <option value="warning">amarillo</option>
                    <option value="danger">Rosa</option>
                </select>
            </div>
        </div>
    </div>
    <script>
        const Color = document.getElementById("selector")
        const card = document.getElementById("card")
        Color.addEventListener("change", function(){
            let colorElegido = Color.value
            card.classList.remove(`bg-${colorElegido}`)
            if (colorElegido === "primary"){
                card.classList.add(`bg-${colorElegido}`)
            }
            else if (colorElegido === "success"){
                card.classList.add(`bg-${colorElegido}`)
            }
            else if (colorElegido === "warning"){
                card.classList.add(`bg-${colorElegido}`)
            }
            else if(colorElegido === "danger"){
                card.classList.add(`bg-${colorElegido}`)
            }
        })
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
